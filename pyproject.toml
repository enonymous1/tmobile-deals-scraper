[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmobile-deals-scraper"
version = "2.0.0"
description = "Fetch and parse special offers from T-Mobile's deals page."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "enonymous1" }]
keywords = ["t-mobile", "deals", "scraper", "aiohttp", "beautifulsoup"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "beautifulsoup4>=4.12",
]

[project.scripts]
tmobile-deals = "tmobile_deals.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
